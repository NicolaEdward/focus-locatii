<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Focus Media location placeholder</title>
  <desc id="desc">Neutral placeholder for advertising locations without a verified photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020814"/>
      <stop offset="0.52" stop-color="#06213a"/>
      <stop offset="1" stop-color="#031322"/>
    </linearGradient>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="150" y="160" width="1300" height="680" rx="28" fill="#061b2d" fill-opacity=".78" stroke="#ffb800" stroke-width="5"/>
  <path d="M355 660h890" stroke="#ffb800" stroke-width="18" stroke-linecap="round"/>
  <path d="M420 620l170-230 145 160 105-120 260 250" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <circle cx="1055" cy="355" r="70" fill="#ffb800"/>
  <text x="800" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="#f8fafc">FOCUS MEDIA</text>
  <text x="800" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffb800">PHOTO WILL BE ADDED AFTER VERIFICATION</text>
</svg>
