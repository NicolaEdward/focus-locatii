name: Release governance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-preview-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: focus_preview_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: ci
      VERCEL_ENV: preview
      ALLOW_SYNTHETIC_SEED: "true"
      PREVIEW_DATASET_ID: focus-media-synthetic-v1
      PREVIEW_TEST_PASSWORD: FocusPreview-CI-Only-2026!
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/focus_preview_ci
      AUTH_SECRET: ci-auth-secret-that-is-not-used-in-production-2026
      CRON_SECRET: ci-cron-secret-that-is-not-used-in-production-2026
      AUTH_EMAIL_DELIVERY_ENABLED: "false"
      MFA_ENFORCEMENT_MODE: "off"
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      SMOKE_BASE_URL: http://localhost:3000
      CAPTURE_BASE_URL: http://localhost:3000
      CAPTURE_OUT_DIR: artifacts/release-screenshots

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure browser is installed
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo "CHROME_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          else
            pnpm dlx playwright@1.58.2 install --with-deps chromium
            FOCUS_CHROME_PATH=$(rg --files --hidden --no-ignore "$HOME/.cache/ms-playwright" | rg '/chrome-linux(64)?/chrome$')
            test -x "$FOCUS_CHROME_PATH"
            echo "CHROME_PATH=$FOCUS_CHROME_PATH" >> "$GITHUB_ENV"
          fi
      - run: pnpm run preview:prepare
      - run: pnpm run test:release-governance
      - run: pnpm run typecheck
      - run: pnpm run test:rbac
      - run: pnpm run test:database-read-retry
      - run: pnpm run test:public-visibility
      - run: pnpm run test:dashboard-command-centers
      - run: pnpm run test:operations-rbac
      - run: pnpm run test:finance-consistency
      - run: pnpm run test:crm
      - name: Focused security and data regressions
        run: |
          node scripts/test-dependency-policy.cjs
          node node_modules/tsx/dist/cli.mjs scripts/test-auth-remediation.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-client-atomic-mutations.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-crm-command-outcomes.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-database-connection-policy.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-media-boundaries.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-data-import-hardening.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-reservation-read-access.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-location-private-read.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-location-mutation-transactions.ts
      - name: Focused operational and financial regressions
        run: |
          node scripts/test-reservation-remediation.cjs
          node node_modules/tsx/dist/cli.mjs scripts/test-finance-remediation.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-finance-plan-and-alerts.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-commercial-workbench.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-transactional-audit.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-operations-controls.ts
          node scripts/test-backup-restore.cjs
          node scripts/test-backup-hardening.cjs
          node scripts/test-remediation-schema.cjs
          node scripts/test-remediation-collation-plan.cjs
          node node_modules/tsx/dist/cli.mjs scripts/test-remediation-history.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-dooh-static-capacity.ts
          node node_modules/tsx/dist/cli.mjs scripts/test-inventory-availability-summary.ts
          node scripts/test-occupancy-summary-ui.cjs
      - run: pnpm prisma validate
      - run: pnpm run build
      - name: Start production server
        run: pnpm start > /tmp/focus-preview.log 2>&1 &
      - name: Wait for server
        run: node -e "const http=require('http');let n=0;const ping=()=>http.get('http://127.0.0.1:3000/admin/login',r=>process.exit(0)).on('error',()=>{if(++n>60)process.exit(1);setTimeout(ping,1000)});ping()"
      - run: pnpm run smoke:roles
      - name: Interactive UI regressions
        run: node scripts/release/smoke-ui-regressions.cjs
      - name: Occupancy summary browser states
        run: node scripts/release/smoke-occupancy-summary.cjs
        env:
          OCCUPANCY_UI_BASE_URL: http://localhost:3000
      - run: pnpm run smoke:capture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: role-smoke-screenshots
          path: artifacts/release-screenshots
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: occupancy-summary-browser-states
          path: artifacts/occupancy-ui
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: interactive-ui-regressions
          path: artifacts/ui-regressions
          if-no-files-found: warn
          retention-days: 14
